# A CDN node serving many sites. surge challenges the site whose share of
# traffic jumps during a surge; limit_req and limit_conn are the static
# backstop so one site can never use the whole node. Size the rate well
# above your busiest site's peak. Run the sidecar with --watch so blocks
# reach nftables within a second:
#     examples/nftables-sidecar.sh --watch /var/run/surge/blocks.txt
#
# http {
#     lua_shared_dict surge 64m;
#     limit_req_zone  $host zone=perhost:20m rate=5000r/s;
