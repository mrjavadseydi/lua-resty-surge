# Load once with: nft -f examples/nftables.conf
# Then run nftables-sidecar.sh --watch to populate these sets.
# Addresses in these sets are blocked on the node's HTTP/HTTPS ports before
# nginx sees the request; HTTP allow rules cannot override this filter.
table inet surge {
    set block4 {
        type ipv4_addr
        flags interval, timeout
    }
    set block6 {
        type ipv6_addr
        flags interval, timeout
    }
    chain input {
        type filter hook input priority 0; policy accept;
        tcp dport { 80, 443 } ip saddr @block4 drop
        tcp dport { 80, 443 } ip6 saddr @block6 drop
    }
}
